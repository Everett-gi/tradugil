spring:
  application:
    name: tradugil-api

  datasource:
    url: ${TRADUGIL_DB_URL}
    username: ${TRADUGIL_DB_USUARIO}
    password: ${TRADUGIL_DB_SENHA}
    hikari:
      # O free tier do Neon corta conexoes ociosas e limita o total. Um pool
      # pequeno com vida curta evita o erro de "connection closed" que
      # aparece depois de alguns minutos parado.
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 900000

  jpa:
    open-in-view: false
    hibernate:
      # O schema e do Flyway, nunca do Hibernate. 'validate' faz a aplicacao
      # recusar a subir se o codigo e a migracao divergirem, em vez de
      # descobrir a divergencia em producao no primeiro select.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # O QUE ISTO RESOLVE: N+1.
        #
        # GiriaResumo le, de cada giria, as definicoes aprovadas, as
        # categorias e o idioma. As tres sao LAZY, entao uma pagina de 50
        # resultados custava 1 consulta da lista + 50 de definicoes + 50 de
        # categorias + 50 de idioma. Medido contra o Neon: 1 item em 98 ms,
        # 50 itens em 1,97 s. Linear no numero de itens, que e a assinatura
        # do problema.
        #
        # Com o lote, o Hibernate junta os carregamentos pendentes num
        # "WHERE giria_id IN (...)" e as 150 consultas viram 3.
        #
        # Global, e nao @BatchSize em cada colecao, de proposito: assim vale
        # tambem para os caminhos que ninguem auditou e para os que ainda vao
        # existir. O modo de falhar de @BatchSize e alguem criar uma consulta
        # nova e esquecer a anotacao, e esse esquecimento nao aparece em teste
        # nenhum: so aparece como lentidao em producao.
        default_batch_fetch_size: 64

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  # O maior corpo legitimo e o /traduzir com 5000 caracteres, que da uns 20 KB
  # em UTF-8 no pior caso. 64 KB deixa folga e ainda recusa cedo quem manda
  # megabytes so para ocupar memoria e thread.
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
    # Faz o Tomcat reescrever o endereco do cliente a partir do
    # X-Forwarded-For, e SO quando a conexao vem de um proxy confiavel (as
    # faixas privadas, onde o Caddy roda). Requisicao que chega de fora tem o
    # cabecalho ignorado.
    #
    # Isso importa para o limitador por IP: e daqui que sai o endereco em que
    # ele confia. Ler o cabecalho por conta propria, como a primeira versao do
    # filtro fazia, desfazia essa validacao e deixava qualquer um forjar o
    # proprio endereco para ganhar cota nova.
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  error:
    # O texto enviado para traducao pode aparecer numa stack trace. Nada de
    # detalhe de erro sai para o cliente.
    include-message: never
    include-stacktrace: never
  compression:
    # Ligado, mas nao vale contar com ele: as respostas grandes desta API
    # saem com Transfer-Encoding chunked, sem Content-Length, e nesse caso
    # o conector nao comprime -- verificado no /dicionario/pacotes, que
    # voltou com 23 KB identicos com e sem Accept-Encoding: gzip.
    #
    # Quem comprime de verdade e o Caddy, na borda (ver infra/Caddyfile).
    # Isto fica como rede de segurança para quem rodar a API sem ele.
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

tradugil:
  cors:
    # O PADRAO E O DOMINIO REAL, e nao localhost.
    #
    # A versao anterior trazia localhost aqui, o que significava que uma
    # implantacao feita sem sobrescrever a variavel aceitaria requisicao
    # vinda da maquina de qualquer pessoa e recusaria a do proprio site.
    #
    # Nao era um furo grave (a API nao usa cookie, entao CORS nao concede
    # acesso a credencial de ninguem, e as rotas liberadas ja sao publicas),
    # mas e o tipo de padrao que envelhece mal: no dia em que existir um
    # endpoint com credencial, o valor errado ja estaria em producao.
    #
    # As origens de desenvolvimento vivem em application-dev.yml. O site em
    # producao nem precisa desta lista: o Caddy serve site e API na mesma
    # origem, e requisicao de mesma origem nao passa por CORS. Quem precisa
    # dela e a extensao de navegador.
    origens: https://tradugil.app,https://www.tradugil.app

  documentacao:
    # A documentacao descreve toda a superficie da API: e material de trabalho
    # para quem desenvolve e material de reconhecimento para quem ataca.
    # Fechada por padrao, e ligada explicitamente em desenvolvimento
    # (application-dev.yml). Assim o esquecimento deixa a documentacao
    # indisponivel, em vez de publicada sem ninguem ter decidido isso.
    publica: false

  ia:
    # Teto diario de chamadas ao modelo. Deliberadamente baixo: e mais facil
    # subir o numero depois de ver a fatura do que explicar uma fatura que
    # nao deveria ter existido. Sem ANTHROPIC_API_KEY, a camada fica
    # desligada e a API atende normalmente pelos niveis 0 a 2.
    cota-diaria: 500

logging:
  level:
    root: INFO
    br.com.tradugil: INFO
