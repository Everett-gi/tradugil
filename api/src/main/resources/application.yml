spring:
  application:
    name: tradugil-api

  datasource:
    url: ${TRADUGIL_DB_URL}
    username: ${TRADUGIL_DB_USUARIO}
    password: ${TRADUGIL_DB_SENHA}
    hikari:
      # O free tier do Neon corta conexoes ociosas e limita o total. Um pool
      # pequeno com vida curta evita o erro de "connection closed" que
      # aparece depois de alguns minutos parado.
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 900000

  jpa:
    open-in-view: false
    hibernate:
      # O schema e do Flyway, nunca do Hibernate. 'validate' faz a aplicacao
      # recusar a subir se o codigo e a migracao divergirem, em vez de
      # descobrir a divergencia em producao no primeiro select.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    # O texto enviado para traducao pode aparecer numa stack trace. Nada de
    # detalhe de erro sai para o cliente.
    include-message: never
    include-stacktrace: never
  compression:
    # Ligado, mas nao vale contar com ele: as respostas grandes desta API
    # saem com Transfer-Encoding chunked, sem Content-Length, e nesse caso
    # o conector nao comprime -- verificado no /dicionario/pacotes, que
    # voltou com 23 KB identicos com e sem Accept-Encoding: gzip.
    #
    # Quem comprime de verdade e o Caddy, na borda (ver infra/Caddyfile).
    # Isto fica como rede de segurança para quem rodar a API sem ele.
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

tradugil:
  cors:
    origens: http://localhost:5173,http://localhost:4173

  ia:
    # Teto diario de chamadas ao modelo. Deliberadamente baixo: e mais facil
    # subir o numero depois de ver a fatura do que explicar uma fatura que
    # nao deveria ter existido. Sem ANTHROPIC_API_KEY, a camada fica
    # desligada e a API atende normalmente pelos niveis 0 a 2.
    cota-diaria: 500

logging:
  level:
    root: INFO
    br.com.tradugil: INFO
