name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execucao por branch: um push novo cancela a anterior em vez de manter
# duas filas competindo pelos mesmos runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Menor privilegio para o GITHUB_TOKEN.
#
# Sem este bloco o token herda o padrao do repositorio, que em muitos casos e
# leitura E ESCRITA. Uma acao de terceiro comprometida, ou um passo de build
# que execute codigo de uma dependencia, teria permissao de empurrar commit,
# criar release e mexer em issue com a identidade do repositorio.
#
# A CI aqui so le codigo e publica artefato de build, entao contents: read
# basta. Um job que precisar de mais declara o proprio bloco, o que torna a
# necessidade visivel na revisao em vez de implicita.
permissions:
  contents: read

jobs:
  api:
    name: API (Java 21)
    runs-on: ubuntu-latest

    services:
      # Postgres real, nunca H2: a busca do nivel 2 depende de pg_trgm, que
      # so existe no Postgres. Um teste verde em H2 nao provaria nada sobre
      # o comportamento em producao.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradugil_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # A presenca desta variavel e o que liga os testes de integracao.
      # Sem ela (na maquina do desenvolvedor, sem Postgres), eles sao
      # pulados com aviso, e os testes de unidade continuam rodando.
      TRADUGIL_TEST_DB_URL: jdbc:postgresql://localhost:5432/tradugil_teste
      TRADUGIL_TEST_DB_USUARIO: postgres
      TRADUGIL_TEST_DB_SENHA: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Testes
        run: mvn -B --no-transfer-progress test
        working-directory: api

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-api
          path: api/target/surefire-reports/
          retention-days: 7

  core-ts:
    name: Logica compartilhada (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/core-ts/package-lock.json

      - run: npm ci
        working-directory: packages/core-ts

      - name: Verificacao de tipos
        run: npm run typecheck
        working-directory: packages/core-ts

      - name: Testes
        run: npm test
        working-directory: packages/core-ts

  web:
    name: Site e PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: packages/core-ts

      - run: npm ci
        working-directory: web

      - name: Build (inclui verificacao de tipos)
        run: npm run build
        working-directory: web

      - name: Publicar site gerado
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist/
          retention-days: 7

  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Preparar SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes de unidade
        run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: android

      # Compila o APK que sera distribuido pelo site. Nao assina: a chave de
      # release fica fora do repositorio, e um APK assinado na CI exigiria o
      # keystore aqui dentro.
      - name: Montar APK de depuracao
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  extensao:
    name: Extensao de navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # Nao precisa instalar packages/core-ts antes: o esbuild resolve o
      # TypeScript dele direto pelo link file:, e ele nao tem dependencias de
      # execucao proprias. Conferido rodando o build com o node_modules de
      # core-ts removido.
      - run: npm ci
        working-directory: extension

      - name: Verificacao de tipos
        run: npm run typecheck
        working-directory: extension

      - name: Empacotar
        run: npm run build
        working-directory: extension
        env:
          NODE_ENV: production

      # Prova que o dist gerado e carregavel: o manifesto tem que ser JSON
      # valido e cada arquivo que ele cita tem que existir. Um caminho errado
      # no manifesto so aparece na hora de instalar, e nao ha instalacao na CI.
      - name: Conferir o pacote
        run: node conferir-pacote.mjs
        working-directory: extension

      - name: Publicar extensao
        uses: actions/upload-artifact@v4
        with:
          name: extensao
          path: extension/dist/
          retention-days: 7

  dependencias:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Falha em vulnerabilidade alta ou critica. Abaixo disso apenas
      # reporta: bloquear o CI por uma dependencia de desenvolvimento com
      # severidade baixa treina a equipe a ignorar o alerta.
      - name: Auditoria npm
        run: |
          npm audit --audit-level=high --prefix packages/core-ts
          npm audit --audit-level=high --prefix web
          npm audit --audit-level=high --prefix extension

  implantacao:
    name: Imagens de implantacao
    runs-on: ubuntu-latest

    # POR QUE ISTO E UM JOB DA CI, E NAO SO UMA CONFERENCIA
    #
    # Aqui e onde as imagens que vao para o ar sao construidas. O servidor
    # apenas baixa e sobe.
    #
    # Isso deixou de ser preferencia quando o servidor virou uma e2-micro do
    # Google: 0,25 de vCPU e 1 GB de RAM. Compilar a API com Maven nela
    # levaria dezenas de minutos e provavelmente morreria sem memoria no
    # meio de um deploy, que e o pior momento para descobrir qualquer coisa.
    #
    # Dois pontos deste build sao fragua de verdade:
    #
    # A borda NAO usa a imagem caddy pronta. O rate_limit do Caddyfile e
    # modulo de terceiro, e a imagem oficial nao o traz: a borda e compilada
    # com xcaddy. Se o modulo parar de compilar contra a versao do Caddy, e
    # aqui que se descobre, e nao no servidor.
    #
    # O site e construido dentro da imagem, e nao na maquina de quem faz o
    # deploy. Entao o que a CI constroi e exatamente o que vai para o ar.

    # O unico job que escreve alguma coisa. O bloco fica aqui, e nao no topo
    # do arquivo, para a permissao a mais ser visivel na revisao em vez de
    # valer para todos os jobs por tabela.
    permissions:
      contents: read
      packages: write

    env:
      # MINUSCULO, E ESCRITO NA MAO.
      #
      # `github.repository_owner` devolve "Everett-gi", com E maiusculo, e o
      # GHCR recusa: "repository name must be lowercase". As expressoes do
      # Actions nao tem funcao para baixar caixa, entao a saida seria um passo
      # so para isso.
      #
      # Escrito aqui tem uma vantagem que compensa: este valor PRECISA bater
      # com o `image:` do docker-compose.yml, que e o que o servidor baixa.
      # Gerado por expressao, os dois poderiam divergir sem ninguem ver; lado
      # a lado no texto, a divergencia aparece na revisao.
      REGISTRO: ghcr.io/everett-gi

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # So publica em push para a main. Num pull request o job continua
      # construindo, o que prova que compila, e nao publica: senao qualquer
      # PR conseguiria trocar a imagem que o servidor baixa.
      - name: Entrar no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SO amd64. A e2-micro do Google e x86_64.
      #
      # Construir tambem para arm64 aqui custaria caro: o runner e x86, e o
      # Maven rodaria dentro do QEMU, o que multiplica o tempo do build por
      # varias vezes. Se um dia o servidor virar ARM, esta e a linha que muda,
      # e e melhor mudar de proposito do que pagar o custo todo dia por um
      # cenario que nao existe.
      - name: Construir e publicar a API
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          # A tag movel e a que o compose usa; a do commit existe para dar
          # para voltar atras sem adivinhar qual imagem estava no ar.
          tags: |
            ${{ env.REGISTRO }}/tradugil-api:main
            ${{ env.REGISTRO }}/tradugil-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A borda e construida DUAS vezes de proposito, e a segunda e de graca.
      #
      # O buildx nao aceita --load e --push na mesma invocacao. E a validacao
      # do Caddyfile precisa rodar DENTRO da imagem, o que exige ela no
      # daemon local, entao a ordem e: constroi e carrega, valida, e so
      # depois publica. A segunda passagem acerta o cache inteiro.
      #
      # Publicar antes de validar inverteria a coisa mais importante daqui:
      # uma imagem com Caddyfile quebrado ficaria disponivel para o servidor
      # baixar.
      - name: Construir a borda
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.caddy
          platforms: linux/amd64
          push: false
          load: true
          tags: tradugil-borda:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O compose so revela erro de sintaxe e de referencia quando alguem
      # sobe. `config` resolve o arquivo inteiro e falha se um servico
      # apontar para um Dockerfile que nao existe, por exemplo.
      #
      # O env_file de producao nao existe no runner, e nem deveria: ele tem
      # a senha do banco. Um vazio no lugar basta para a validacao.
      - name: Validar o compose
        run: |
          sudo mkdir -p /etc/tradugil
          sudo touch /etc/tradugil/api.env
          docker compose -f infra/docker-compose.yml config > /dev/null
          echo "compose valido"

      # O Caddyfile e a peca com mais regra de seguranca do projeto: TLS,
      # cabecalhos, os tetos por rota. Um erro de sintaxe ali derruba a
      # borda inteira, e junto com ela o site e a API.
      # Valida DENTRO da imagem construida, e nao com um Caddy qualquer. E o
      # unico jeito de provar o que importa aqui: que o rate_limit existe
      # naquele binario. Um Caddy padrao recusaria a diretiva, e um Caddy
      # padrao tolerante seria pior ainda, porque a borda subiria sem teto.
      - name: Validar o Caddyfile
        run: |
          docker run --rm tradugil-borda:ci \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Conferir o script do DuckDNS
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck infra/duckdns-atualiza.sh infra/publicar-apk.sh

      # So agora, com o Caddyfile validado dentro da imagem. O cache da
      # passagem anterior esta inteiro, entao isto e quase instantaneo.
      - name: Publicar a borda
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.caddy
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRO }}/tradugil-borda:main
            ${{ env.REGISTRO }}/tradugil-borda:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
