name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execucao por branch: um push novo cancela a anterior em vez de manter
# duas filas competindo pelos mesmos runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java 21)
    runs-on: ubuntu-latest

    services:
      # Postgres real, nunca H2: a busca do nivel 2 depende de pg_trgm, que
      # so existe no Postgres. Um teste verde em H2 nao provaria nada sobre
      # o comportamento em producao.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradugil_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # A presenca desta variavel e o que liga os testes de integracao.
      # Sem ela (na maquina do desenvolvedor, sem Postgres), eles sao
      # pulados com aviso, e os testes de unidade continuam rodando.
      TRADUGIL_TEST_DB_URL: jdbc:postgresql://localhost:5432/tradugil_teste
      TRADUGIL_TEST_DB_USUARIO: postgres
      TRADUGIL_TEST_DB_SENHA: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Testes
        run: mvn -B --no-transfer-progress test
        working-directory: api

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-api
          path: api/target/surefire-reports/
          retention-days: 7

  core-ts:
    name: Logica compartilhada (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/core-ts/package-lock.json

      - run: npm ci
        working-directory: packages/core-ts

      - name: Verificacao de tipos
        run: npm run typecheck
        working-directory: packages/core-ts

      - name: Testes
        run: npm test
        working-directory: packages/core-ts

  web:
    name: Site e PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: packages/core-ts

      - run: npm ci
        working-directory: web

      - name: Build (inclui verificacao de tipos)
        run: npm run build
        working-directory: web

      - name: Publicar site gerado
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist/
          retention-days: 7

  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Preparar SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes de unidade
        run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: android

      # Compila o APK que sera distribuido pelo site. Nao assina: a chave de
      # release fica fora do repositorio, e um APK assinado na CI exigiria o
      # keystore aqui dentro.
      - name: Montar APK de depuracao
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  dependencias:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Falha em vulnerabilidade alta ou critica. Abaixo disso apenas
      # reporta: bloquear o CI por uma dependencia de desenvolvimento com
      # severidade baixa treina a equipe a ignorar o alerta.
      - name: Auditoria npm
        run: |
          npm audit --audit-level=high --prefix packages/core-ts
          npm audit --audit-level=high --prefix web
